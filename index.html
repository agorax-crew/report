:root{--ink:#211C33;--purple:#6B5FC7;--pd:#4A3FA8;--paper:#F4F2FB;--surface:#fff;--line:#E4E0F0;--muted:#6E6885}

body{background:var(--paper);color:var(--ink);height:100vh;overflow:hidden}

.gcard input:focus{outline:none;border-color:var(--purple)}
.gcard button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:11px;background:var(--purple);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.gcard button:hover{background:var(--pd)}

.item:hover{border-color:var(--purple);background:#FAF9FE}

.main{height:100vh;background:var(--paper)}
.main iframe{width:100%;height:100%;border:0;background:#fff}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{height:auto;max-height:44vh}.main{height:56vh}}

x}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:16px}\n.card h3{font-size:16px;font-weight:800;margin-bottom:4px}.card h3 .sub{font-weight:600;color:var(--muted);font-size:12px;margin-left:6px}\n.verdict{background:linear-gradient(135deg,#EEFBF4,#F4F1FC);border:1px solid #CDE9DA;border-radius:18px;padding:22px 26px;margin:18px 0}\n.verdict .tag{display:inline-block;background:var(--good);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:5px 16px}\n.verdict h3{font-size:20px;margin:12px 0 8px;color:#17603f}\n.verdict p{font-size:15px;color:#245}\n.trend{display:flex;gap:6px;align-items:flex-end;height:170px;padding:16px 4px 0}\n.trend .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}\n.trend .bars{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}\n.trend .b{width:16px;border-radius:4px 4px 0 0;position:relative}\n.trend .b .cap{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted)}\n.trend .dl{font-size:10.5px;color:var(--muted)}\n.vtrend{display:flex;gap:6px;align-items:flex-end;height:120px;padding:14px 4px 0}\n.vday{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}\n.vb{width:60%;background:linear-gradient(180deg,#8b7ff0,#6B5FC7);border-radius:4px 4px 0 0;position:relative;min-height:2px}\n.vcap{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--muted)}\n.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px}.legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}\n.cbar{display:grid;grid-template-columns:52px 1fr 46px;gap:10px;align-items:center;margin:12px 0}\n.cbar .cl{font-weight:800;font-size:14px;text-align:right}.cbar .ct{background:#F0EEF7;border-radius:7px;height:20px;overflow:hidden}.cbar .cf{height:100%;border-radius:7px}\n.cbar .cv{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}.cbar .cs{grid-column:2/4;font-size:11px;color:var(--muted);margin-top:-6px}\n.cmp{display:flex;gap:10px;align-items:stretch;margin-top:8px}\n.cmp .box{flex:1;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}\n.cmp .box .w{font-size:12px;color:var(--muted);font-weight:700}.cmp .box .big{font-size:24px;font-weight:800;margin-top:4px}\n.cmp .arrow{display:flex;align-items:center;font-size:20px;color:var(--muted)}\ntable{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}\nth{color:var(--muted);font-size:11px;background:var(--lilac)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}\n.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10px;font-weight:800;color:#fff}\n.ins{border-left:4px solid var(--purple);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:12px 0;box-shadow:var(--shadow)}\n.ins.warn{border-left-color:var(--warn)}.ins.good{border-left-color:var(--good)}\n.ins h4{font-size:14.5px;margin-bottom:6px;color:var(--pd)}.ins.warn h4{color:var(--warn)}.ins.good h4{color:#17603f}\n.ins ul{margin:6px 0 0;padding-left:20px}.ins li{margin:4px 0;font-size:14px}\n.act{counter-reset:a}.act .item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}\n.act .num2{flex:none;width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}\n.foot{color:var(--muted);font-size:12px;text-align:center;padding:22px}\n.kpi2{font-size:12px;font-weight:800;border-radius:6px;padding:1px 7px;margin-left:6px}.up{background:#E7F7EF;color:#17603f}.down{background:#FBF1F0;color:#C0392B}\n</style></head><body>\n<header><div class=\"in\">\n<div class=\"eyebrow\">DAUM COMMUNITY · SEASON 2 · 기획 리포트</div>\n<h1>1차 격주(8/3~8/16) 운영 성과 보고</h1>\n<div class=\"sub\">크루 231명 · 2주간 활동·참여·효과 종합 분석</div>\n<div class=\"by\">작성: 커뮤니티 기획 · 데이터 기준 8/3~8/16 (반응데이터 일요일 마감 스냅샷)</div>\n</div></header>\n<div class=\"wrap\">\n\n<div class=\"verdict\">\n  <span class=\"tag\">결론 · 초기 성과 긍정적</span>\n  <h3>\"폐쇄 루프가 열리기 시작했다\" — 방향은 맞다. 관건은 '소수 집중'의 완화.</h3>\n  <p>2주간 원글 <b>6,373건</b>·답글 <b>26,584건</b>·조회 <b>2,483,416</b>을 만들었고, 무엇보다 <b>외부(일반) 유저 답글 비중이 20.3%→22.4%로 상승</b>했습니다. 1기의 외부 참여가 사실상 0(0.04%)이었던 것과 비교하면 구조적 전환입니다. 크루 리텐션도 <b>226/232명(약 97%)</b>으로 매우 높습니다. 다만 조회의 <b>47.8%</b>·외부반응의 <b>63.3%</b>가 상위 10% 크루에 몰려 있어, 다음 과제는 '참여의 저변 확대'입니다.</p>\n</div>\n\n<h2 class=\"sec\"><span class=\"n\">01</span>규모 & 추이</h2>\n<div class=\"tiles\">\n  <div class=\"tile\"><div class=\"k\">원글</div><div class=\"v\">6,373</div><div class=\"s\">W2 2,888 <span class=\"kpi2 down\">▼17%</span></div></div>\n  <div class=\"tile\"><div class=\"k\">답글</div><div class=\"v\">26,584</div><div class=\"s\">W2 11,980 <span class=\"kpi2 down\">▼18%</span></div></div>\n  <div class=\"tile\"><div class=\"k\">누적 조회</div><div class=\"v\">2,483,416</div><div class=\"s\">원글 노출</div></div>\n  <div class=\"tile\"><div class=\"k\">투표 참여</div><div class=\"v\">27,206</div><div class=\"s\">투표형 원글</div></div>\n</div>\n<div class=\"card\"><h3>일별 원글·답글 <span class=\"sub\">14일</span></h3>\n  <div class=\"trend\"><div class=\"day\" title=\"08-03 원글 748 · 답글 3,260\"><div class=\"bars\">\n        <div class=\"b\" style=\"height:100%;background:var(--purple)\"></div>\n        <div class=\"b\" style=\"height:100%;background:#1baf7a\"></div>\n        </div><div class=\"dl\">08-03</div></div><div class=\"day\" title=\"08-04 원글 640 · 답글 2,670\"><div class=\"bars\">\n        <div class=\"b\" style=\"height:86%;background:var(--purple)\"></div>\n        <div class=\"b\" style=\"height:82%;background:#1baf7a\"></div>\n        </div><div class=\"dl\">08-04</div></div><div class=\"day\" title=\"08-05 원글 519 · 답글 2,170\"><div class=\"bars\">\n        <div class=\"b\" style=\"height:69%;background:var(--purple)\"></div>\n        <div class=\"b\" style=\"height:67%;background:#1baf7a\"></div>\n        </div><div class=\"dl\">08-05</div></div><div class=\"day\" title=\"08-06 원글 406 · 답글 1,738\"><div class=\"bars\">\n        <div class=\"b\" style=\"height:54%;background:var(--purple)\"></div>\n        <div class=\"b\" style=\"height:53%;background:#1baf7a\"></div>\n        </div><div class=\"dl\">08-06</div></div><div class=\"day\" title=\"08-07 원글 405 · 답글 1,369\"><div class=\"bars\">\n        <div class=\"b\" style=\"height:54%;background:var(--purple)\"></div>\n        <div class=\"b\" style=\"height:42%;background:#1baf7a\"></div>\n        </div><div class=\"dl\">08-07</div></div><div class=\"day\" title=\"08-08 원글 412 · 답글 1,814\"><div class=\"bars\">\n        <div class=\"b\" style=\"height:55%;background:var(--purple)\"></div>\n        <div class=\"b\" style=\"height:56%;background:#1baf7a\"></div>\n        </div><div class=\"dl\">08-08</div></div><div class=\"day\" title=\"08-09 원글 355 · 답글 1,583\"><div class=\"bars\">\n        <div class=\"b\" style=\"height:47%;background:var(--purple)\"></div>\n        <div class=\"b\" style=\"height:49%;background:#1baf7a\"></div>\n        </div><div class=\"dl\">08-09</div></div><div class=\"day\" title=\"08-10 원글 484 · 답글 1,780\"><div class=\"bars\">\n        <div class=\"b\" style=\"height:65%;background:var(--purple)\"></div>\n        <div class=\"b\" style=\"height:55%;background:#1baf7a\"></div>\n        </div><div class=\"dl\">08-10</div></div><div class=\"day\" title=\"08-11 원글 429 · 답글 1,914\"><div class=\"bars\">\n        <div class=\"b\" style=\"height:57%;background:var(--purple)\"></div>\n        <div class=\"b\" style=\"height:59%;background:#1baf 고계 손절 시작...삼성전자 영상도 비공개 전환. ↗</a></td></tr></tbody></table></div></div>\n\n<h2 class=\"sec\"><span class=\"n\">06</span>리스크 & 개선 과제</h2>\n<div class=\"ins warn\"><h4>① 소수 집중 (최우선 과제)</h4><ul>\n<li>상위 10% 크루가 <b>조회 47.8% · 외부반응 63.3%</b> 차지. '스타 몇 명'에 성과가 쏠려 있어, 나머지의 참여 저변을 넓히지 못하면 성장 한계.</li>\n<li>제언: 하위·중위 크루 대상 <b>콘텐츠 코칭 / 포맷 가이드</b>, 노출면(인기글 풀) 신인 슬롯 배려.</li></ul></div>\n<div class=\"ins warn\"><h4>② 카테고리 이탈 11.0%</h4><ul>\n<li>배정과 다른 주제 원글이 11.0%. 반응 잘 나오는 주제(정치·라이프)로 새는 유인이 존재.</li>\n<li>제언: 리그 원글 점수는 '내 카테고리'만 인정(이미 적용) + 카테고리 밖은 특별상으로 흡수(적용). 지속 모니터링.</li></ul></div>\n<div class=\"ins warn\"><h4>③ 품앗이 의존</h4><ul>\n<li>받은 답글의 약 79%가 서포터즈(크루)끼리. 외부 유입이 커지기 전까진 불가피하나, 평가는 <b>외부 반응 절대량</b> 중심 유지 권장.</li></ul></div>\n\n<h2 class=\"sec\"><span class=\"n\">07</span>기획자 제언 — 다음 2주</h2>\n<div class=\"card act\">\n  <div class=\"item\"><div class=\"num2\">1</div><div><b>참여 저변 확대</b> — 상위 집중 완화가 최우선. 중·하위 크루 대상 '반응 잘 나오는 글쓰기' 코칭 + 우수 사례 공유(특정 공식 강요는 지양).</div></div>\n  <div class=\"item\"><div class=\"num2\">2</div><div><b>카테고리별 맞춤 전략</b> — 스포츠·연예는 참여형(질문·예측·투표) 포맷 가이드로 전환율 개선, 경제는 강점 유지.</div></div>\n  <div class=\"item\"><div class=\"num2\">3</div><div><b>외부 유입 심화 분석</b> — 외부 반응자가 '신규 유저'인지 '같은 소수'인지 확인(ClickHouse 연결 필요). 재방문·팔로우 전환이 진짜 성장 지표.</div></div>\n  <div class=\"item\"><div class=\"num2\">4</div><div><b>노출→반응 인과 추적</b> — 인기글 풀 주간 스냅샷 적재 시작함. 어떤 글이 노출을 받고 실제 반응으로 이어지는지 다음 회차부터 측정.</div></div>\n  <div class=\"item\"><div class=\"num2\">5</div><div><b>미션 난이도 점검</b> — 미션 통과 소폭 감소. 도입기 1주 예외(8월)로 이탈은 방어했으나, 격주 미션 안내를 더 명확히.</div></div>\n</div>\n<div class=\"ins\"><h4>한 줄 총평</h4><ul><li>2주 데이터로 볼 때 <b>\"방향은 맞다\"</b>가 결론입니다. 외부 참여가 실제로 열렸고 리텐션도 탄탄합니다. 다음 단계의 성패는 <b>성과를 소수에서 다수로 퍼뜨리는 것</b>과 <b>외부 유입의 질(신규·재방문)을 확인하는 것</b>에 달렸습니다.</li></ul></div>\n</div>\n<div class=\"foot\">Daum 커뮤니티 2기 · 1차 격주 운영 리포트 · 내부용 대외비 · 반응데이터는 일요일 마감 스냅샷(이후 증가분 미반영)</div>\n</body></html>"}, "expo": {"id": "expo", "title": "크루글 노출·반응 심화 분석", "tag": "심화 분석", "desc": "조회→외부반응 전환, 외부답글 Top30, 정치·시사 분리 지표와 활용 제언.", "html": "<!DOCTYPE html><html lang=ko><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\">\n<title>크루글 노출·반응 심화 분석</title>\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css\">\n<style>\n:root{--ink:#211C33;--purple:#6B5FC7;--pd:#4A3FA8;--paper:#F7F6FB;--surface:#fff;--lilac:#EEEBFA;--line:#E4E0F0;--muted:#6E6885;--warn:#C0392B;--good:#1E9E6A}\n*{margin:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,sans-serif}\nbody{background:var(--paper);color:var(--ink);line-height:1.6;padding:32px 16px}\n.wrap{max-width:920px;margin:0 auto}\n.hd{background:linear-gradient(135deg,#5B4FBF,#3A3086);color:#fff;border-radius:20px;padding:34px 34px 30px;margin-bottom:26px}\n.hd .eb{letter-spacing:4px;font-size:13px;opacity:.8}\n.hd h1{font-size:29px;font-weight:800;margin-top:8px}\n.hd .sub{opacity:.9;margin-top:10px;font-size:14.5px}\n.note{background:#FFF7E6;border:1px solid #F0D488;border-radius:12px;padding:12px 16px;font-size:13.5px;color:#7A5B00;margin-bottom:24px}\n.sec{font-size:20px;font-weight:800;margin:30px 0 6px;display:flex;align-items:center;gap:10px}\n.sec .nn{background:var(--purple);color:#fff;width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}\n.lead{color:var(--muted);font-size:14px;margin-bottom:14px}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 6px 24px rgba(74,63,168,.06)}\n.card h3{font-size:15.5px;margin-bottom:14px}\n.card h3 .sub{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:6px}\ntable{width:100%;border-collapse:collapse;font-size:13px}\nth,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}\nth{color:var(--muted);font-weight:700;font-size:11.5px;background:#FAF9FE}\ntd.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}\ntd.hi{color:var(--warn);font-weight:800}\na{color:var(--pd);text-decoration:none} a:hover{text-decoration:underline}\n.pill{display:inline-block;color:#fff;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}\n.pf{display:inline-block;margin-left:5px;background:#F3E8FB;color:#6B2E9E;border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:700}\n.cbar{display:grid;grid-template-columns:74px 1fr 46px;gap:10px;align-items:center;margin:11px 0}\n.cbar .cl{font-weight:800;font-size:13.5px}\n.cbar .ct{background:#EEEBF7;border-radius:8px;height:16px;overflow:hidden}\n.cbar .cf{height:100%;border-radius:8px}\n.cbar .cv{font-weight:800;text-align:right;font-size:14px}\n.cbar .cs{grid-column:2/4;color:var(--muted);font-size:11.5px;margin-top:-4px}\n.kbox{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 4px}\n.kb{border-radius:14px;padding:16px 18px}\n.kb.a{background:#F3E8FB;border:1px solid #D9B8F0} .kb.b{background:#EAF7F0;border:1px solid #B7E3CC}\n.kb .t{font-size:12.5px;color:var(--muted);font-weight:700}\n.kb .big{font-size:30px;font-weight:800;margin:4px 0}\n.kb.a .big{color:#8e44ad} .kb.b .big{color:#1E9E6A}\n.kb .d{font-size:12.5px;color:var(--muted)}\n.ins{background:var(--lilac);border-radius:12px;padding:14px 18px;margin-top:12px}\n.ins h4{font-size:14px;margin-bottom:6px;color:var(--pd)}\n.ins ul{margin:0;padding-left:18px} .ins li{margin:5px 0;font-size:13.5px}\n.ins.warn{background:#FDECEA} .ins.warn h4{color:var(--warn)}\n.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}\n</style></head><body><div class=\"wrap\">\n<div class=\"hd\"><div class=\"eb\">DAUM COMMUNITY · SEASON 2 · 내부용 대외비</div>\n<h1>크루글 노출·반응 심화 분석</h1>\n<div class=\"sub\">8/3~8/16 · '조회 대비 얼마나 외부(일반유저) 반응을 끌어냈나' + 외부답글 순위 + 일반유저 선호 주제 분리</div></div>\n\n<div class=\"note\">ℹ️ <b>노출(인기글 풀 노출 횟수)</b> 자체를 세는 테이블은 없었습니다(엔진 DB는 '조회' 이벤트만 적재). 대신 ClickHouse의 <b>식별(로그인) 조회 로그</b>가 붙어서, 조회를 <b>크루 vs 일반유저</b>로 처음으로 분리했습니다 — 아래 <b>0번 섹션</b>이 그 결과입니다. (기존 1~4번은 실측 조회·답글 기반이라 그대로 유효.)</div>\n\n<h2 class=\"sec\"><span class=\"nn\" style=\"background:#8e44ad\">0</span>식별 조회로 본 '진짜 도달' <span style=\"font-size:13px;color:var(--muted);font-weight:600;margin-left:8px\">NEW · ClickHouse</span></h2>\n<p class=\"lead\">엔진 로그의 <b>로그인 유저 조회</b>(전체 조회의 약 10%, 나머지는 익명)에서 조회자를 크루/일반유저로 분리. 대상: 외부 조회가 실제로 붙은 크루 원글 711개(crew 원글 8,045개 중 식별조회 데이터 있는 711개(8.8%) 기준).</p>\n<div class=\"kbox\" style=\"grid-template-columns:1fr 1fr 1fr\">\n<div class=\"kb a\"><div class=\"t\">식별 조회 중 외부(일반유저) 비중</div><div class=\"big\">94%</div><div class=\"d\">크루 글을 읽는 사람의 대부분이 <b>크루가 아닌 일반유저</b>. 답글은 79%가 품앗이였지만, <b>'읽기'는 이미 바깥에서 일어남</b></div></div>\n<div class=\"kb b\"><div class=\"t\">고유 외부 조회자</div><div class=\"big\">30,922<span style=\"font-size:15px\">명</span></div><div class=\"d\">소수 clique가 아니라 <b>3만 명 규모의 넓은 도달</b>. '같은 몇 명이 도는 것'이라는 우려와 반대</div></div>\n<div class=\"kb\" style=\"background:#FDECEA;border:1px solid #F0C9C4\"><div class=\"t\">그 중 단 1주만 방문(재방문 X)</div><div class=\"big\" style=\"color:#C0392B\">97%</div><div class=\"d\">2주 이상 재방문은 <b>3%</b>(868명)뿐. <b>넓게 닿지만 붙잡지 못함</b> — 진짜 과제</div></div>\n</div>\n<div class=\"card\"><h3>카테고리별 식별 조회 외부비중 <span class=\"sub\">외부 조회 / (외부+크루) 조회</span></h3><div style=\"overflow-x:auto\"><table>\n<thead><tr><th>카테고리</th><th class=\"num\">글</th><th class=\"num\">외부 조회</th><th class=\"num\">외부비중</th><th class=\"num\">글당 외부조회</th></tr></thead>\n<tbody><tr><td><span class=\"pill\" style=\"background:#8e44ad\">일반/기타</span></td><td class=\"num\">13</td><td class=\"num\">1,667</td><td class=\"num\"><b>98.3%</b></td><td class=\"num\">128</td></tr><tr><td><span class=\"pill\" style=\"background:#1baf7a\">경제</span></td><td class=\"num\">187</td><td class=\"num\">8,780</td><td class=\"num\"><b>95.2%</b></td><td class=\"num\">47</td></tr><tr><td><span class=\"pill\" style=\"background:#eda100\">라이프</span></td><td class=\"num\">241</td><td class=\"num\">18,210</td><td class=\"num\"><b>94.6%</b></td><td class=\"num\">76</td></tr><tr><td><span class=\"pill\" style=\"background:#2a78d6\">스포츠</span></td><td class=\"num\">111</td><td class=\"num\">2,017</td><td class=\"num\"><b>91.0%</b></td><td class=\"num\">18</td></tr><tr><td><span class=\"pill\" style=\"background:#eb6834\">연예</span></td><td class=\"num\">159</td><td class=\"num\">3,620</td><td class=\"num\"><b>89.3%</b></td><td class=\"num\">23</td></tr></tbody></table></div>\n<div class=\"ins\"><h4>읽는 법</h4><ul>\n<li>모든 카테고리가 외부비중 <b>89~98%</b> — 조회 단계에선 카테고리 무관하게 이미 일반유저가 압도적. '조회수=크루 품앗이'가 아니라 <b>실제 외부 도달</b>임이 확인됩니다.</li>\n<li>정치·시사 글은 외부비중 <b>98.6%</b>·글당 외부조회 <b>145</b>로 비정치(43)의 3배 이상 — 답글뿐 아니라 <b>조회 도달</b>에서도 시사성이 강합니다.</li>\n<li><b>핵심 시사점</b>: 크루 프로젝트는 '읽는 도달'은 이미 성공(3만 외부 독자). 다음 단계는 이 일회성 독자를 <b>재방문·참여로 전환</b>하는 것 — 조회는 넓은데 재방문 3%, 외부 답글 전환도 낮음(1~4번 참고).</li></ul></div></div>\n\n<h2 class=\"sec\"><span class=\"nn\">1</span>노출(조회) → 반응 전환</h2>\n<p class=\"lead\">조회를 실제 <b>외부(일반유저) 답글</b>로 바꾸는 힘. 핵심 지표는 <b>외부답글/1,000조회</b>(전환 효율)와 <b>외부비중</b>(받은 답글 중 일반유저 비율 = 품앗이 아닌 진짜 반응).</p>\n<div class=\"card\"><h3>카테고리별 전환 효율 <span class=\"sub\">외부답글 / 1,000조회</span></h3><div class=\"cbar\"><div class=\"cl\" style=\"color:#8e44ad\">일반/기타</div><div class=\"ct\"><div class=\"cf\" style=\"width:100%;background:#8e44ad\"></div></div><div class=\"cv\">3.78</div><div class=\"cs\">외부비중 86.7% · 조회평균 1,103 · 원글 110</div></div><div class=\"cbar\"><div class=\"cl\" style=\"color:#1baf7a\">경제</div><div class=\"ct\"><div class=\"cf\" style=\"width:67%;background:#1baf7a\"></div></div><div class=\"cv\">2.55</div><div class=\"cs\">외부비중 39.6% · 조회평균 319 · 원글 1840</div></div><div class=\"cbar\"><div class=\"cl\" style=\"color:#2a78d6\">스포츠</div><div class=\"ct\"><div class=\"cf\" style=\"width:38%;background:#2a78d6\"></div></div><div class=\"cv\">1.43</div><div class=\"cs\">외부비중 18.6% · 조회평균 117 · 원글 1091</div></div><div class=\"cbar\"><div class=\"cl\" style=\"color:#eb6834\">연예</div><div class=\"ct\"><div class=\"cf\" style=\"width:25%;background:#eb6834\"></div></div><div class=\"cv\">0.93</div><div class=\"cs\">외부비중 16.6% · 조회평균 403 · 원글 1388</div></div><div class=\"cbar\"><div class=\"cl\" style=\"color:#eda100\">라이프</div><div class=\"ct\"><div class=\"cf\" style=\"width:24%;background:#eda100\"></div></div><div class=\"cv\">0.9</div><div class=\"cs\">외부비중 11.3% · 조회평균 560 · 원글 1941</div></div></div>\n<div class=\"card\"><h3>카테고리별 반응 퍼널</h3><div style=\"overflow-x:auto\"><table>\n<thead><tr><th>카테고리</th><th class=\"num\">원글</th><th class=\"num\">조회평균</th><th class=\"num\">반응률¹</th><th class=\"num\">외부답글</th><th class=\"num\">/1k조회</th><th class=\"num\">외부비중²</th></tr></thead>\n<tbody><tr><td><span class=\"pill\" style=\"background:#8e44ad\">일반/기타</span></td><td class=\"num\">110</td><td class=\"num\">1,103</td><td class=\"num\">12.7%</td><td class=\"num\">458</td><td class=\"num\"><b>3.78</b></td><td class=\"num\">86.7%</td></tr><tr><td><span class=\"pill\" style=\"background:#1baf7a\">경제</span></td><td class=\"num\">1,840</td><td class=\"num\">319</td><td class=\"num\">10.1%</td><td class=\"num\">1,500</td><td class=\"num\"><b>2.55</b></td><td class=\"num\">39.6%</td></tr><tr><td><span class=\"pill\" style=\"background:#2a78d6\">스포츠</span></td><td class=\"num\">1,091</td><td class=\"num\">117</td><td class=\"num\">7.5%</td><td class=\"num\">183</td><td class=\"num\"><b>1.43</b></td><td class=\"num\">18.6%</td></tr><tr><td><span class=\"pill\" style=\"background:#eb6834\">연예</span></td><td class=\"num\">1,388</td><td class=\"num\">403</td><td class=\"num\">16.6%</td><td class=\"num\">522</td><td class=\"num\"><b>0.93</b></td><td class=\"num\">16.6%</td></tr><tr><td><span class=\"pill\" style=\"background:#eda100\">라이프</span></td><td class=\"num\">1,941</td><td class=\"num\">560</td><td class=\"num\">19.6%</td><td class=\"num\">983</td><td class=\"num\"><b>0.9</b></td><td class=\"num\">11.3%</td></tr><tr style=\"font-weight:800;background:#F3F0FB\"><td><span class=\"pill\" style=\"background:#211C33\">전체</span></td><td class=\"num\">6,370</td><td class=\"num\">390</td><td class=\"num\">14.0%</td><td class=\"num\">3,646</td><td class=\"num\"><b>1.47</b></td><td class=\"num\">21.2%</td></tr></tbody></table></div>\n<div style=\"font-size:11.5px;color:var(--muted);margin-top:8px\">¹ 반응률 = 외부답글 1개 이상 받은 원글 비율 · ² 외부비중 = (외부답글)/(외부+크루답글). 낮을수록 품앗이 의존.</div>\n<div class=\"ins\"><h4>읽는 법</h4><ul>\n<li><b>일반/기타</b>(사실상 정치·시사)가 조회는 소수(원글 110개)인데 전환 효율 <b>3.78</b>·외부비중 <b>86.7%</b>로 압도적. 일반유저가 '진짜로' 붙는 주제입니다.</li>\n<li><b>라이프·연예</b>는 조회평균은 높지만(눈길은 끔) 전환 0.9~0.93, 외부비중 16.6% 이하 — 받은 답글 대부분이 <b>크루 품앗이</b>라 활동 종료 시 사라질 반응입니다.</li>\n<li><b>경제</b>는 중간이지만 안에서도 편차 큼(아래 2번).</li></ul></div></div>\n\n<h2 class=\"sec\"><span class=\"nn\">2</span>일반유저가 '진짜로' 좋아하는 글 = 정치·시사</h2>\n<p class=\"lead\">제목 키워드로 정치·정책·시사 글을 분리해 비교. 소수의 글이 외부 반응을 독식합니다.</p>\n<div class=\"kbox\">\n<div class=\"kb a\"><div class=\"t\">정치·시사 원글 비중 → 외부답글 점유</div><div class=\"big\">4.6% → 25.1%</div>\n<div class=\"d\">전체 원글의 4.6%(293개)에 불과한 정치·시사 글이 <b>전체 외부답글의 25.1%</b>를 가져감</div></div>\n<div class=\"kb b\"><div class=\"t\">외부답글/1,000조회 (정치 vs 비정치)</div><div class=\"big\">2.27 vs 1.31</div>\n<div class=\"d\">같은 조회여도 정치글이 <b>1.7배</b> 더 많은 일반유저 답글. 외부비중도 75.6% vs 17.1%</div></div>\n</div>\n<div class=\"card\"><h3>'경제' 안에서도 정책 vs 생활경제</h3><div style=\"overflow-x:auto\"><table>\n<thead><tr><th>구분</th><th class=\"num\">원글</th><th class=\"num\">외부답글</th><th class=\"num\">/1k조회</th><th class=\"num\">외부비중</th></tr></thead>\n<tbody>\n<tr><td><span class=\"pill\" style=\"background:#1baf7a\">경제·정책</span><span class=\"pf\">🏛️</span></td><td class=\"num\">214</td><td class=\"num\">516</td><td class=\"num\"><b>3.42</b></td><td class=\"num\">78.3%</td></tr>\n<tr><td><span class=\"pill\" style=\"background:#1baf7a\">경제·생활</span></td><td class=\"num\">1,626</td><td class=\"num\">984</td><td class=\"num\">2.26</td><td class=\"num\">31.4%</td></tr>\n</tbody></table></div>\n<div class=\"ins\"><h4>인사이트</h4><ul>\n<li>'경제'를 하나로 보면 안 됩니다. <b>정책·시사성 경제글</b>(민생지원금·부동산정책·정부계획)은 외부비중 78.3%로 생활경제(31.4%)의 2배 이상 — 일반유저 대화가 붙는 건 정책 쪽.</li>\n<li>즉 <b>운영이 밀어야 할 '진짜 반응' 주제 = 정치·정책·사회 시사</b>. 반대로 라이프·연예·생활경제는 조회는 좋지만 품앗이 반응이라 지표를 부풀릴 위험.</li></ul></div></div>\n\n<h2 class=\"sec\"><span class=\"nn\">3</span>외부답글 Top 30 (품앗이 제외한 '진짜 반응' 순위)</h2>\n<p class=\"lead\"><b>외부:크루 비율</b>이 핵심 — 이 값이 클수록 크루끼리가 아니라 일반유저가 몰린 글입니다(5 이상 강조).</p>\n<div class=\"card\"><div style=\"overflow-x:auto\"><table>\n<thead><tr><th class=\"num\">#</th><th>닉네임</th><th>주제</th><th class=\"num\">외부답글</th><th class=\"num\">크루답글</th><th class=\"num\">외부:크루</th><th class=\"num\">조회</th><th>제목</th></tr></thead>\n<tbody><tr><td class=\"num\">1</td><td>깅그리치</td><td><span class=\"pill\" style=\"background:#8e44ad\">일반/기타</span><span class=\"pf\">🏛️ 정치·시사</span></td><td class=\"num\"><b>125</b></td><td class=\"num\">4</td><td class=\"num hi\">31.25</td><td class=\"num\">33,177</td><td><a href=\"https://agorax.daum.net/content/019feb9b-2115-7d47-8b4c-4ec9ddd7471b\" target=\"_blank\">이재명 대통령 지지율 떨어지고 있는 이유가 뭣때문이라고 보시나요? ↗</a></td></tr><tr><td class=\"num\">2</td><td>이안의경제노트</td><td><span class=\"pill\" style=\"background:#1baf7a\">경제</span></td><td class=\"num\"><b>122</b></td><td class=\"num\">5</td><td class=\"num hi\">24.4</td><td class=\"num\">3,711</td><td><a href=\"https://agorax.daum.net/content/019ff961-f136-7d9c-b529-024e2b3f22d5\" target=\"_blank\">담배로 주변에 피해주는 사람이 많기 때문에 올려야 한다. ↗</a></td></tr><tr><td class=\"num\">3</td><td>이게무슨일</td><td><span class=\"pill\" style=\"background:#eda100\">라이프</span></td><td class=\"num\"><b>102</b></td><td class=\"num\">11</td><td class=\"num hi\">9.27</td><td class=\"num\">14,755</td><td><a href=\"https://agorax.daum.net/content/019fd768-06e0-73cb-ad5b-a8b1c786e8d5\" target=\"_blank\">전라도만 수능을 따로..? ↗</a></td></tr><tr><td class=\"num\">4</td><td>그린비</td><td><span class=\"pill\" style=\"background:#1baf7a\">경제</span></td><td class=\ function buildList(){
  const L=document.getElementById('list'); L.innerHTML='';
  IDX.forEach(r=>{

function select(id){

}
